<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement Loyer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #F5F0E8; padding: 20px; max-width: 480px; margin: 0 auto; color: #1A2B5E; }
    h2 { color: #1A2B5E; }
    .hidden { display: none; }
    .card { border: 1px solid #ECE6D6; background: #fff; padding: 18px; border-radius: 12px; margin-top: 20px; }
    input { padding: 10px; border: 1px solid #ECE6D6; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; text-transform: uppercase; letter-spacing: 2px; }
    button { padding: 12px 20px; margin: 6px 0; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; }
    .search-btn { background: #1A2B5E; color: white; margin-top: 10px; }
    .bank { background: #1A2B5E; color: white; }
    .momo { background: #FFCC00; color: #1A2B5E; }
    .moov { background: #0033A0; color: white; }
    .celtis { background: #2ECC71; color: white; }
    .error { color: #993C1D; }
    .success { color: #3B6D11; font-weight: bold; }
    .muted { color: #7A6F52; font-size: 13px; }
    .amount { font-size: 22px; font-weight: bold; margin: 8px 0; }
    #payButtons button { display: inline-block; }
    .spinner { text-align: center; padding: 20px; color: #7A6F52; }
  </style>
</head>
<body>
  <h2>Payer mon loyer</h2>
  <p class="muted">Entrez le code à 6 caractères reçu de votre propriétaire.</p>

  <div class="card">
    <label for="codeInput"><strong>Code de paiement</strong></label>
    <input type="text" id="codeInput" maxlength="6" placeholder="EX: A1B2C3">
    <button class="search-btn" onclick="fetchTenant()">Valider le code</button>
  </div>

  <div id="loading" class="spinner hidden">Recherche...</div>
  <div id="resultSection" class="hidden card"></div>
  <div id="confirmSection" class="hidden card"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import {
      getFirestore, doc, getDoc, updateDoc, addDoc, collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    // ⚠️ Remplacez par la config réelle de votre projet Firebase
    // (visible dans Firebase Console → Paramètres du projet → Général)
    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "VOTRE_PROJET.firebaseapp.com",
      projectId: "VOTRE_PROJET",
      storageBucket: "VOTRE_PROJET.appspot.com",
      messagingSenderId: "VOTRE_SENDER_ID",
      appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentTenant = null; // { uid, tenantId, code, name, rentAmount, ... }

    window.fetchTenant = async function () {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const resultSection = document.getElementById('resultSection');
      const confirmSection = document.getElementById('confirmSection');
      const loading = document.getElementById('loading');

      resultSection.classList.add('hidden');
      confirmSection.classList.add('hidden');

      if (code.length !== 6) {
        resultSection.classList.remove('hidden');
        resultSection.innerHTML = "<p class='error'>Le code doit contenir 6 caractères.</p>";
        return;
      }

      loading.classList.remove('hidden');
      try {
        // 1. Chercher le code dans payment_codes
        const codeRef = doc(db, 'payment_codes', code);
        const codeSnap = await getDoc(codeRef);

        if (!codeSnap.exists()) {
          resultSection.classList.remove('hidden');
          resultSection.innerHTML = "<p class='error'>Code introuvable. Vérifiez auprès de votre propriétaire.</p>";
          return;
        }

        const { uid, tenantId } = codeSnap.data();

        // 2. Récupérer les infos du locataire
        const tenantRef = doc(db, 'users', uid, 'locataires', tenantId);
        const tenantSnap = await getDoc(tenantRef);

        if (!tenantSnap.exists()) {
          resultSection.classList.remove('hidden');
          resultSection.innerHTML = "<p class='error'>Dossier locataire introuvable.</p>";
          return;
        }

        const tenant = tenantSnap.data();
        currentTenant = { uid, tenantId, code, ...tenant };

        // 3. Afficher les infos + boutons de paiement
        resultSection.classList.remove('hidden');
        resultSection.innerHTML = `
          <h3>${escapeHtml(tenant.name || 'Locataire')}</h3>
          <p class="muted">${escapeHtml(tenant.roomNumber || '')} ${tenant.propertyName ? '· ' + escapeHtml(tenant.propertyName) : ''}</p>
          <p class="amount">${formatAmount(tenant.rentAmount)} FCFA</p>
          <p class="muted">Statut actuel : ${escapeHtml(tenant.statusLabel || '—')}</p>
        `;

        confirmSection.classList.remove('hidden');
        confirmSection.innerHTML = `
          <p><strong>Choisir un mode de paiement :</strong></p>
          <div id="payButtons">
            <button class="momo" onclick="pay('MTN Momo')">MTN Momo</button>
            <button class="moov" onclick="pay('Moov Money')">Moov Money</button>
            <button class="celtis" onclick="pay('Celtis Cash')">Celtis Cash</button>
            <button class="bank" onclick="pay('Banque')">Virement bancaire</button>
          </div>
        `;
      } catch (e) {
        resultSection.classList.remove('hidden');
        resultSection.innerHTML = "<p class='error'>Erreur : " + escapeHtml(e.message) + "</p>";
      } finally {
        loading.classList.add('hidden');
      }
    };

    window.pay = async function (provider) {
      if (!currentTenant) return;

      const confirmSection = document.getElementById('confirmSection');
      confirmSection.innerHTML = "<p class='muted'>Enregistrement du paiement...</p>";

      const amount = parseAmount(currentTenant.rentAmount);
      const { uid, tenantId, code, name } = currentTenant;

      try {
        // NOTE : ceci enregistre l'intention de paiement.
        // Pour un vrai paiement Mobile Money, il faudrait rediriger vers
        // l'API du fournisseur (MTN/Moov/Celtis) et ne confirmer qu'après
        // callback de succès. Ici on enregistre directement (mode "confirmation manuelle").

        // 1. Créer l'enregistrement de paiement
        await addDoc(collection(db, 'users', uid, 'paiements'), {
          tenantId: tenantId,
          tenantName: name || '',
          amount: amount,
          method: provider,
          status: 'paye',
          confirmationCode: code,
          createdAt: serverTimestamp()
        });

        // 2. Mettre à jour le dossier locataire
        await updateDoc(doc(db, 'users', uid, 'locataires', tenantId), {
          lastPaymentDate: serverTimestamp(),
          lastPaymentAmount: amount,
          confirmationCode: code
        });

        confirmSection.innerHTML = `
          <p class="success">✅ Paiement enregistré via ${escapeHtml(provider)} !</p>
          <p class="muted">Merci ${escapeHtml(name || '')}, votre propriétaire a été notifié.</p>
        `;
      } catch (e) {
        confirmSection.innerHTML = "<p class='error'>Échec de l'enregistrement : " + escapeHtml(e.message) + "</p><p class='muted'>Vérifiez votre connexion et réessayez.</p>";
      }
    };

    function formatAmount(value) {
      const n = parseAmount(value);
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function parseAmount(value) {
      if (typeof value === 'number') return value;
      if (!value) return 0;
      const digits = String(value).replace(/[^0-9]/g, '');
      return digits ? parseInt(digits, 10) : 0;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str ?? '');
      return div.innerHTML;
    }
  </script>
</body>
</html>
